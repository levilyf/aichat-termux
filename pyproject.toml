[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicode-termux"
version = "0.1.0"
description = "AI coding agent for Termux — multi-provider (NVIDIA NIM, OpenAI, Anthropic, Gemini, Groq, OpenRouter, Ollama) with full TUI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "you" }]
keywords = ["ai", "coding-agent", "termux", "nvidia-nim", "llm", "cli"]

dependencies = [
    "textual>=0.50.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "prompt-toolkit>=3.0.43",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
aicode = "aicode.__main__:main"

[tool.setuptools.packages.find]
include = ["aicode*"]

[tool.setuptools.package-data]
aicode = ["tui/*.tcss", "py.typed"]
