# Example config for aicode — copy to ~/.config/aicode/config.toml and edit.
# Run `aicode config init` to write this automatically.

# ─────────────────────────── PROFILES ───────────────────────────
# Each profile binds: provider + model + api_key + (optional) base_url
# api_key can be a literal string OR "${ENV_VAR}" to read from env.

[profiles.nim]
provider = "nim"
model = "meta/llama-3.3-70b-instruct"
api_key = "${NVIDIA_API_KEY}"
base_url = "https://integrate.api.nvidia.com/v1"

[profiles.nim-coder]
provider = "nim"
model = "qwen/qwen2.5-coder-32b-instruct"
api_key = "${NVIDIA_API_KEY}"
base_url = "https://integrate.api.nvidia.com/v1"

[profiles.gpt]
provider = "openai"
model = "gpt-4o"
api_key = "${OPENAI_API_KEY}"
base_url = "https://api.openai.com/v1"

[profiles.claude]
provider = "anthropic"
model = "claude-3-5-sonnet-20241022"
api_key = "${ANTHROPIC_API_KEY}"

[profiles.gemini]
provider = "gemini"
model = "gemini-2.0-flash"
api_key = "${GEMINI_API_KEY}"

[profiles.groq]
provider = "groq"
model = "llama-3.3-70b-versatile"
api_key = "${GROQ_API_KEY}"
base_url = "https://api.groq.com/openai/v1"

[profiles.openrouter]
provider = "openrouter"
model = "anthropic/claude-3.5-sonnet"
api_key = "${OPENROUTER_API_KEY}"
base_url = "https://openrouter.ai/api/v1"

[profiles.ollama]
provider = "ollama"
model = "llama3.2:3b"
api_key = "ollama"
base_url = "http://localhost:11434/v1"

# ─────────────────────────── ROUTING ───────────────────────────
# task_type -> profile name. Used by the auto-router.
# Override per-turn with `/model <profile>`.

[routing]
coding = "nim-coder"      # code generation/editing → Qwen Coder on NIM
reasoning = "claude"      # design/debug/explain → Claude
simple = "groq"           # small talk / quick facts → Groq (fast)
default = "nim"           # fallback

# ─────────────────────────── SHELL ───────────────────────────

[shell]
require_approval = true   # ask before running risky commands (rm, mv, sudo, ...)
timeout = 120             # seconds

# ─────────────────────────── UI ───────────────────────────

[ui]
theme = "dark"
show_file_tree = true

# ─────────────────────────── CUSTOM SLASH COMMANDS ───────────────────────────
# Define your own /commands — each maps to a prompt the agent runs.
# Use $ARGS to inject whatever the user typed after the command.
# Use $FILE to inject the contents of a file path the user provides.

[commands.test]
description = "Run tests and fix any failures"
prompt = "Run the test suite (try pytest first, fall back to npm test), then fix any failures. Show me what you changed and why."

[commands.lint]
description = "Lint and fix style issues"
prompt = "Run the linter on this project (try ruff for Python, eslint for JS), then fix the issues it reports."

[commands.refactor]
description = "Refactor a specific file or function — /refactor <path>"
prompt = "Refactor $ARGS to be cleaner and more idiomatic. Preserve behavior. Explain your changes."

[commands.explain]
description = "Explain a file or concept — /explain <path>"
prompt = "Explain $ARGS in detail. If it's a file, read it first. Cover what it does, how it works, and any non-obvious design choices."

[commands.docstring]
description = "Add docstrings to a file — /docstring <path>"
prompt = "Read $ARGS and add Google-style docstrings to every public function and class. Don't change behavior."

# ─────────────────────────── AUTO-COMMIT ───────────────────────────
# Automatically git commit after the agent makes successful edits.
# {summary} is replaced with a short summary of what changed.

[auto_commit]
enabled = false
message_template = "chore: aicode — {summary}"
require_clean_tree = true  # only auto-commit if the tree was clean before

# ─────────────────────────── MCP SERVERS ───────────────────────────
# Model Context Protocol servers — exposes external tools to the agent.
# Each server runs as a subprocess speaking JSON-RPC over stdio.
# Example: filesystem MCP server (gives the agent access to a sandboxed dir)

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp/sandbox"]
env = {}

[mcp_servers.sqlite]
command = "uvx"
args = ["mcp-server-sqlite", "--db-path", "./data.db"]
env = {}
